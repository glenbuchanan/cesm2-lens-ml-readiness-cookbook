version: 1
extends:
  - https://raw.githubusercontent.com/projectpythia/pythia-config/main/pythia.yml
project:
  title: CESM2 LENS ML Readiness Cookbook
  github: https://github.com/glenbuchanan/cesm2-lens-ml-readiness-cookbook
  authors:
    - name: Glen Buchanan
  copyright: '2026'
  plugins:
    - cookbook-render.mjs
  toc:
    - file: README.md
    - title: Preamble
      children:
        - file: notebooks/how-to-cite.md
        - file: notebooks/glossary.md
    - title: Chapters
      children:
        - file: notebooks/01-find-the-data.ipynb
        - file: notebooks/02-target-and-forced-response.ipynb
        - file: notebooks/03-split-by-member.ipynb
        - file: notebooks/04-baselines-and-the-ladder.ipynb
        - file: notebooks/05-refinement-trials.ipynb
        - file: notebooks/06-test-and-justify.ipynb
        - file: notebooks/07-out-of-period-test.ipynb
    - title: Data
      children:
        - file: notebooks/data/README.md
  jupyter:
      binder:
        url: https://binder.projectpythia.org
        repo: glenbuchanan/cesm2-lens-ml-readiness-cookbook
site:
  options:
    logo_alt: Project Pythia logo (site home)
