name: publish-book

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    uses: ProjectPythia/cookbook-actions/.github/workflows/build-book.yaml@main
    with:
      # --strict: a notebook cell error (or any other build error) fails the build. Without it `myst build --execute --html`
      # exits 0 and publishes the traceback into the page.
      build_command: 'myst build --execute --html --strict'

  deploy:
    needs: build
    uses: ProjectPythia/cookbook-actions/.github/workflows/deploy-book.yaml@main
