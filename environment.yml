# cesm2-lens-ml-readiness-cookbook — build + execution environment, named <cookbook-name>-dev as Project Pythia asks.
# Exact pins only on the four libraries that move the printed numbers (numpy, pandas, scipy, scikit-learn), so chapter 7's
# scored result can be reproduced; everything else floats so upstream changes surface in the build. Why: issue #1.
name: cesm2-lens-ml-readiness-cookbook-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - jupyterlab
  - ipykernel
  - numpy=2.5.4
  - pandas=3.0.6
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - matplotlib
  - xarray
  - zarr
  - s3fs
  - cftime
  - intake
  - intake-esm
  - mystmd
  - jupyterlab-myst
